<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Swipe & Keep</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: #e94560;
    }

    .counter {
      font-size: 14px;
      color: #888;
    }

    .progress-bar {
      position: absolute;
      top: 56px;
      left: 20px;
      right: 20px;
      height: 4px;
      background: #333;
      border-radius: 2px;
      z-index: 10;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #0f3460);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .card-area {
      position: relative;
      width: 300px;
      height: 400px;
    }

    .card {
      position: absolute;
      width: 300px;
      height: 400px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      transition: box-shadow 0.2s;
      will-change: transform;
    }

    .card-bg {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      z-index: 0;
    }

    .card-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 30px;
      text-align: center;
    }

    .card-emoji {
      font-size: 100px;
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .card-name {
      font-size: 26px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .card-desc {
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      line-height: 1.4;
    }

    .stamp {
      position: absolute;
      top: 30px;
      font-size: 36px;
      font-weight: 900;
      padding: 8px 16px;
      border: 4px solid;
      border-radius: 10px;
      transform: rotate(-15deg);
      opacity: 0;
      z-index: 5;
      pointer-events: none;
    }

    .stamp-keep {
      right: 20px;
      color: #4ecdc4;
      border-color: #4ecdc4;
    }

    .stamp-discard {
      left: 20px;
      color: #e94560;
      border-color: #e94560;
      transform: rotate(15deg);
    }

    .hint-arrows {
      position: absolute;
      bottom: -50px;
      display: flex;
      gap: 80px;
      align-items: center;
      z-index: 2;
    }

    .hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #666;
    }

    .hint-icon {
      font-size: 28px;
    }

    /* Results screen */
    .results-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 20px;
      max-height: 100dvh;
      overflow-y: auto;
    }

    .results-screen.active {
      display: flex;
    }

    .results-title {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #e94560, #0f3460);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .results-subtitle {
      font-size: 14px;
      color: #888;
      margin-top: -12px;
    }

    .results-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .result-emoji {
      font-size: 44px;
    }

    .result-info {
      text-align: left;
    }

    .result-name {
      font-size: 16px;
      font-weight: 600;
    }

    .result-desc {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .btn {
      padding: 14px 40px;
      border-radius: 50px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #e94560, #0f3460);
      color: #fff;
    }

    .empty-msg {
      font-size: 16px;
      color: #888;
      text-align: center;
      padding: 40px 0;
    }

    /* Start screen */
    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      padding: 40px;
    }

    .start-screen.hidden {
      display: none;
    }

    .start-emoji {
      font-size: 64px;
    }

    .start-title {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #e94560, #0f3460);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .start-desc {
      color: #888;
      font-size: 15px;
      line-height: 1.6;
      max-width: 280px;
    }

    .game-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .game-screen.active {
      display: flex;
    }
  </style>
</head>
<body>
  <!-- Start Screen -->
  <div class="start-screen" id="startScreen">
    <div class="start-emoji">👆</div>
    <div class="start-title">Swipe & Keep</div>
    <div class="start-desc">
      Swipe through items.<br>
      <strong style="color:#4ecdc4">Right → Keep</strong><br>
      <strong style="color:#e94560">Left → Discard</strong><br><br>
      Pick 5 items to keep!
    </div>
    <button class="btn btn-primary" onclick="startGame()">Start</button>
  </div>

  <!-- Game Screen -->
  <div class="game-screen" id="gameScreen">
    <div class="header">
      <div class="title">Swipe & Keep</div>
      <div class="counter" id="counter">0 / 5 kept</div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>

    <div class="card-area" id="cardArea"></div>
  </div>

  <!-- Results Screen -->
  <div class="results-screen" id="resultsScreen">
    <div class="results-title">Your Picks</div>
    <div class="results-subtitle" id="resultsSubtitle"></div>
    <div class="results-grid" id="resultsGrid"></div>
    <button class="btn btn-primary" onclick="resetGame()">Play Again</button>
  </div>

  <script>
    const ITEMS = [
      { emoji: '🎸', name: 'Guitar', desc: 'Rock out with six strings', color: '#c0392b' },
      { emoji: '🔭', name: 'Telescope', desc: 'Gaze at distant stars', color: '#2c3e50' },
      { emoji: '🎨', name: 'Art Palette', desc: 'Paint your masterpiece', color: '#8e44ad' },
      { emoji: '🏔️', name: 'Mountain', desc: 'Conquer the summit', color: '#1abc9c' },
      { emoji: '📚', name: 'Books', desc: 'Dive into stories', color: '#d35400' },
      { emoji: '🎧', name: 'Headphones', desc: 'Lose yourself in music', color: '#2980b9' },
      { emoji: '🏄', name: 'Surfboard', desc: 'Ride the perfect wave', color: '#16a085' },
      { emoji: '🍕', name: 'Pizza', desc: 'The ultimate comfort food', color: '#e67e22' },
      { emoji: '🐶', name: 'Puppy', desc: 'Your loyal best friend', color: '#795548' },
      { emoji: '🚀', name: 'Rocket', desc: 'Blast off to the unknown', color: '#34495e' },
      { emoji: '🎮', name: 'Game Controller', desc: 'Enter virtual worlds', color: '#6c3483' },
      { emoji: '☕', name: 'Coffee', desc: 'Fuel your mornings', color: '#6d4c41' },
      { emoji: '🌮', name: 'Taco', desc: 'Crunchy deliciousness', color: '#f39c12' },
      { emoji: '🎬', name: 'Movie Camera', desc: 'Lights, camera, action', color: '#2c3e50' },
      { emoji: '🌺', name: 'Flower', desc: 'Beauty in bloom', color: '#e91e63' },
      { emoji: '⚽', name: 'Soccer Ball', desc: 'The beautiful game', color: '#27ae60' },
      { emoji: '🎹', name: 'Piano', desc: 'Melodies at your fingertips', color: '#1a1a2e' },
      { emoji: '🧁', name: 'Cupcake', desc: 'Sweet little treat', color: '#e84393' },
      { emoji: '🏖️', name: 'Beach', desc: 'Sun, sand, and waves', color: '#00b894' },
      { emoji: '🦋', name: 'Butterfly', desc: 'Graceful transformation', color: '#6c5ce7' },
    ];

    const MAX_KEEP = 5;
    let deck = [];
    let kept = [];
    let currentIndex = 0;
    let currentCard = null;

    // Swipe state
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let isDragging = false;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.add('active');
      deck = shuffle(ITEMS);
      kept = [];
      currentIndex = 0;
      updateCounter();
      showCard();
    }

    function resetGame() {
      document.getElementById('resultsScreen').classList.remove('active');
      document.getElementById('gameScreen').classList.remove('active');
      document.getElementById('startScreen').classList.remove('hidden');
    }

    function updateCounter() {
      document.getElementById('counter').textContent = `${kept.length} / ${MAX_KEEP} kept`;
      document.getElementById('progressFill').style.width = `${(kept.length / MAX_KEEP) * 100}%`;
    }

    function showCard() {
      if (kept.length >= MAX_KEEP || currentIndex >= deck.length) {
        showResults();
        return;
      }

      const area = document.getElementById('cardArea');
      area.innerHTML = '';

      const item = deck[currentIndex];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-bg" style="background: linear-gradient(145deg, ${item.color}, ${item.color}cc, #1a1a2e);"></div>
        <div class="card-content">
          <div class="card-emoji">${item.emoji}</div>
          <div class="card-name">${item.name}</div>
          <div class="card-desc">${item.desc}</div>
        </div>
        <div class="stamp stamp-keep">KEEP</div>
        <div class="stamp stamp-discard">NOPE</div>
      `;

      // Hint arrows
      const hints = document.createElement('div');
      hints.className = 'hint-arrows';
      hints.innerHTML = `
        <div class="hint"><span class="hint-icon">👈</span>Discard</div>
        <div class="hint"><span class="hint-icon">👉</span>Keep</div>
      `;
      area.appendChild(hints);
      area.appendChild(card);
      currentCard = card;

      // Touch events
      card.addEventListener('touchstart', onTouchStart, { passive: true });
      card.addEventListener('touchmove', onTouchMove, { passive: false });
      card.addEventListener('touchend', onTouchEnd);

      // Mouse events for desktop testing
      card.addEventListener('mousedown', onMouseDown);
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    }

    function onTouchStart(e) {
      const touch = e.touches[0];
      startX = touch.clientX;
      startY = touch.clientY;
      isDragging = true;
      currentCard.style.transition = 'none';
    }

    function onTouchMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      const touch = e.touches[0];
      currentX = touch.clientX - startX;
      updateCardPosition();
    }

    function onTouchEnd() {
      if (!isDragging) return;
      isDragging = false;
      handleSwipeEnd();
    }

    function onMouseDown(e) {
      startX = e.clientX;
      startY = e.clientY;
      isDragging = true;
      currentCard.style.transition = 'none';
      e.preventDefault();
    }

    function onMouseMove(e) {
      if (!isDragging) return;
      currentX = e.clientX - startX;
      updateCardPosition();
    }

    function onMouseUp() {
      if (!isDragging) return;
      isDragging = false;
      handleSwipeEnd();
    }

    function updateCardPosition() {
      if (!currentCard) return;
      const rotate = currentX * 0.1;
      currentCard.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;

      const keepStamp = currentCard.querySelector('.stamp-keep');
      const discardStamp = currentCard.querySelector('.stamp-discard');
      const progress = Math.min(Math.abs(currentX) / 80, 1);

      if (currentX > 0) {
        keepStamp.style.opacity = progress;
        discardStamp.style.opacity = 0;
      } else {
        discardStamp.style.opacity = progress;
        keepStamp.style.opacity = 0;
      }
    }

    function handleSwipeEnd() {
      const threshold = 80;

      if (Math.abs(currentX) > threshold) {
        const direction = currentX > 0 ? 'right' : 'left';
        animateOut(direction);
      } else {
        // Snap back
        currentCard.style.transition = 'transform 0.3s ease';
        currentCard.style.transform = 'translateX(0) rotate(0deg)';
        const keepStamp = currentCard.querySelector('.stamp-keep');
        const discardStamp = currentCard.querySelector('.stamp-discard');
        keepStamp.style.opacity = 0;
        discardStamp.style.opacity = 0;
      }
      currentX = 0;
    }

    function animateOut(direction) {
      const flyX = direction === 'right' ? 500 : -500;
      const rotate = direction === 'right' ? 30 : -30;

      currentCard.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
      currentCard.style.transform = `translateX(${flyX}px) rotate(${rotate}deg)`;
      currentCard.style.opacity = '0';

      // Clean up mouse listeners
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);

      if (direction === 'right') {
        kept.push(deck[currentIndex]);
        updateCounter();
      }

      currentIndex++;

      setTimeout(() => {
        showCard();
      }, 350);
    }

    function showResults() {
      document.getElementById('gameScreen').classList.remove('active');
      const screen = document.getElementById('resultsScreen');
      screen.classList.add('active');

      const subtitle = document.getElementById('resultsSubtitle');
      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = '';

      if (kept.length === 0) {
        subtitle.textContent = "You didn't keep anything!";
        grid.innerHTML = '<div class="empty-msg">Try again and swipe right on things you like!</div>';
        return;
      }

      subtitle.textContent = `You kept ${kept.length} item${kept.length > 1 ? 's' : ''}`;

      kept.forEach((item, i) => {
        const el = document.createElement('div');
        el.className = 'result-item';
        el.style.animationDelay = `${i * 0.1}s`;
        el.innerHTML = `
          <div class="result-emoji">${item.emoji}</div>
          <div class="result-info">
            <div class="result-name">${item.name}</div>
            <div class="result-desc">${item.desc}</div>
          </div>
        `;
        grid.appendChild(el);
      });
    }
  </script>
</body>
</html>
